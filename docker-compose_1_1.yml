version: "3.9"
services:
  blueprint:
    build: .
    ports:
      - "8080:80"
    container_name: docker-blueprint
    restart: unless-stopped
    healthcheck:
      test: ["CMD","wget","-qO-","http://localhost/health"]
      interval: 15s
      retries: 3

  # Optional: capstone api to demo inside the learning platform itself
  capstone-api:
    build:
      context: ./capstone
      dockerfile: Dockerfile.multi
    environment:
      - REDIS_HOST=capstone-redis
    depends_on:
      capstone-redis:
        condition: service_healthy
    networks: [capstone]

  capstone-redis:
    image: redis:7-alpine
    volumes: [capstonedata:/data]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
    networks: [capstone]

volumes:
  capstonedata:

networks:
  capstone:
